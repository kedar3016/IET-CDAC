<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Registration From</title>
</head>
<body>
<form action = "register" method ="post">

<label>Name : </label><input type = "text" name = "uname" id="uname" placeholder ="Enter User Name"><br>
<label>Email : </label><input type = "text" name = "email" id="email" placeholder ="Enter Email"><br>
<label>Role : </label><input type = "text" name = "role" id="role" placeholder ="Enter Role (user,Manager)"><br>
<label>Set Password : </label><input type = "text" name = "pass" id="pass"><br>
<label>Address : </label><input type = "text" name = "add" id="add" placeholder ="Enter Address"><br>
<label>Date Of Birth : </label><input type = "date" name = "dob" id="dob"><br>
<label>Hobbies : </label><input type = "text" name = "hobby" id="hobby" placeholder ="Enter Hobbies"><br>

<p>select multiple locations:</p>

    <label><input type="checkbox" name="loc" value="mumbai"> Mumbai</label><br>
    <label><input type="checkbox" name="loc" value="pune"> Pune</label><br>
    <label><input type="checkbox" name="loc" value="baroda"> Baroda</label><br>
    <label><input type="checkbox" name="loc" value="kolhapur"> Kolhapur</label><br><br>
    
 <label>Gender : </label>
 <input type = "radio" name ="gen" id="gen" value ="male"><label>Male</label>
 <input type = "radio" name ="gen" id="gen" value ="female"><label>Female</label><br><br>

<button type = "submit" name = "submit" id = "btn">Register!!</button>
<button type = "reset" name = "reset" id = "btn">Reset</button>


</form>
</body>
</html>
