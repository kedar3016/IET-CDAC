<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll</title>
    <script src = "jquery-3.7.1.min.js"></script>
    <style>
        #d1{

            border:2px;
            border-style: solid;
            height: 50px;
            width: 300px;
            background-color: blueviolet;
            border-radius: 8px;
            position: absolute;
            padding: 10px;
        }
        #p1{
            font-family: cursive;
        }
    </style>
</head>
<body>
    <div id ="d1">
        <p id = "p1">Sun Will Rise Agian</p>

    </div><br><br><br><br><br><br>
    <button id = "btn">Scorller</button>
  
    <script>

        $(document).ready(function(){
    $("#btn").click(function(){
        let count = 0;

        function moveRight(){
            $("#d1").animate({left: 1000}, 3000, function(){
                count++;
                if(count < 4){
                    moveLeft();
                } else {
                    moveLeft(true);
                }
            });
        }

        function moveLeft(final = false){
            $("#d1").animate({left: 0}, 3000, function(){
                if(!final){
                    moveRight();
                }
            });
        }

        moveRight();
    });
});

    </script>
    
</body>
</html>
