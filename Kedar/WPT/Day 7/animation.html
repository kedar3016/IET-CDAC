<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <script src = "jquery-3.7.1.min.js"></script>
    <style>
        #d1{

            border:2px;
            border-style: solid;
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            border-radius: 8px;
            position: absolute;
        }
    </style>
</head>
<body>
    <div id ="d1"></div><br><br><br><br><br><br>
    <button id = "btn">Animate</button>
  
    <script>

        $(document).ready(function(){
            $("#btn").click(function(){
                $("#d1").animate({
                    "left":1300,
                    "top" : 500,

                },3000)
            })
            
            
        })
    </script>
    
</body>
</html>
